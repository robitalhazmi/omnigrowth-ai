name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-and-format:
    name: lint-and-format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install Ruff
        run: |
          python -m pip install --upgrade pip
          pip install "ruff>=0.6.0"

      - name: Run Ruff linter
        run: ruff check src/ scripts/ tests/

      - name: Enforce 300-line modularity guardrail on Python files
        run: |
          python - <<'EOF'
          from pathlib import Path
          import sys

          offenders = []
          for folder in ("src", "scripts", "tests", "app"):
              root = Path(folder)
              if not root.exists():
                  continue
              for path in sorted(root.rglob("*.py")):
                  lines = sum(1 for _ in path.open(encoding="utf-8"))
                  if lines >= 300:
                      offenders.append(f"{path}: {lines} lines (limit < 300)")
          if offenders:
              print("Files exceeding 300-line guardrail:\n  " + "\n  ".join(offenders))
              sys.exit(1)
          print("All Python files comply with the < 300-line modularity guardrail.")
          EOF

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build data marts if not present
        run: |
          if [ ! -f data/processed/ga4_events.parquet ]; then
            python scripts/download_datasets.py --offline
            python scripts/build_data_mart.py
          fi

      - name: Run pytest verification suite
        run: pytest tests/ -v
