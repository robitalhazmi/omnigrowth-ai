name: Bug Report
description: Report a bug, regression, SQL error, or memory budget violation in OmniGrowth-AI.
title: "[Bug]: "
labels: ["bug", "triage", "type: bug"]
assignees:
  - robitalhazmi
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and resolve the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug and which module it affects (e.g., DuckDB SQL Lab, A/B Testing, Forecasting, Prescriptive Solver, GenAI/Excel, Streamlit UI).
      placeholder: Describe what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Reproduction Steps
      description: Exact commands or UI steps to reproduce the behavior.
      placeholder: |
        1. Run `python scripts/...` or open Tab X in Streamlit
        2. Set parameter Y to ...
        3. Observe error ...
    validations:
      required: true

  - type: textarea
    id: expected_vs_actual
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually happened instead?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment / OS / Python Version
      description: OS version, Python version, DuckDB version, and whether running locally or on the 2 GB VPS.
      placeholder: "Ubuntu 24.04 LTS, Python 3.12.4, DuckDB 2.0.0 (Local / VPS)"
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs / Traceback / Screenshots
      description: Paste any relevant stack traces, DuckDB errors, or attach screenshots.
      render: shell
    validations:
      required: true
