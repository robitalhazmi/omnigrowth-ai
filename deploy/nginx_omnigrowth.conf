# Nginx reverse proxy configuration for OmniGrowth-AI (Streamlit + WebSocket support)
# Copy to /etc/nginx/sites-available/omnigrowth and symlink to sites-enabled/
# Enable TLS cleanly with: sudo certbot --nginx -d omnigrowth.yourdomain.com

server {
    listen 80;
    server_name omnigrowth.yourdomain.com;

    # Optional: redirect HTTP -> HTTPS after Certbot issuance
    # return 301 https://$host$request_uri;

    client_max_body_size 15M;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Required for Streamlit /_stcore/stream WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
        proxy_buffering off;
    }

    location /_stcore/health {
        proxy_pass http://127.0.0.1:8501/_stcore/health;
    }
}
